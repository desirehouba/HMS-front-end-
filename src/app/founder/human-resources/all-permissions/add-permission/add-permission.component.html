<section class="content">
  <div class="content-block">
    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="header">
            <h2>{{"app.add_permission" | translate }}</h2>
          </div>
          <div class="body">
            <form class="m-4" [formGroup]="permissionForm">
              <div class="row">
                <div class="col-xl-6 col-lg-8 col-md-12 col-sm-12 mb-2">
                  <div *ngIf="staff" class="tbl-spinner">
                    <mat-progress-spinner color="primary"
                      [diameter]="20" mode="indeterminate">
                    </mat-progress-spinner>
                  </div>
                  <mat-form-field appearance="outline" *ngIf="!staff"
                    class="example-full-width mb-3">
                    <mat-label> {{"app.responsable" | translate }}</mat-label>
                    <mat-select formControlName="idUserApprove" required>
                      <mat-option [value]="user.id"
                        *ngFor="let user of staffs">
                        {{ user.name }}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="col-xl-2 col-lg-3 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.start_date" | translate }}</mat-label>
                    <input matInput [matDatepicker]="rpicker"
                      formControlName="dateDepart" required>
                    <mat-datepicker-toggle matSuffix [for]="rpicker">
                    </mat-datepicker-toggle>
                    <mat-datepicker #rpicker></mat-datepicker>
                  </mat-form-field>
                </div>
                <div class="col-xl-2 col-lg-3 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.end_date" | translate }}</mat-label>
                    <input matInput [matDatepicker]="picker"
                      formControlName="dateRetour" required>
                    <mat-datepicker-toggle matSuffix [for]="picker">
                    </mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                  </mat-form-field>
                </div>
                <div class="col-xl-2 col-lg-3 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.duration" | translate }} </mat-label>
                    <input matInput formControlName="duration" type="number">
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.description" | translate }}</mat-label>
                    <textarea matInput formControlName="raison"
                      [rows]="12">
                    </textarea>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <button class="btn-space"
                    [disabled]="!permissionForm.valid || loading"
                    [class.auth-spinner]="loading"
                    (click)="addPermission()" mat-raised-button
                    color="primary">{{"app.save" | translate }}</button>
                  <button type="button" mat-raised-button
                    color="warn" (click)="cancel()">
                    {{"app.cancel" | translate }}
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
