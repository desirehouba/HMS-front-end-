<section class="content">
  <div class="content-block">
    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="header">
            <h2>{{"app.send_sms" | translate }}</h2>
          </div>
          <div class="body">
            <form class="m-4" [formGroup]="smsForm">
              <div class="row">
                <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.message" | translate }}</mat-label>
                    <textarea matInput formControlName="message"
                      [rows]="24">
                    </textarea>
                  </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <div *ngIf="user" class="tbl-spinner">
                    <mat-progress-spinner color="primary" [diameter]="20"
                      mode="indeterminate">
                    </mat-progress-spinner>
                  </div>
                  <mat-form-field appearance="outline"
                    *ngIf="!user && scholar_level != 'CF'"
                    class="example-full-width mb-3">
                    <mat-label> {{"app.student" | translate }}s </mat-label>
                    <input #multiUserSearch type="text" matInput
                      placeholder="Recherche student"
                      (input)="onInputChangeStudents($event)" />
                    <mat-selection-list formControlName="users"
                      (selectionChange)="
                        selectionChangeStudents($event.options)"
                      class="custom-scroll-bar">
                      <ng-container *ngFor="let p of filteredStudents">
                        <mat-list-option [value]="p.idParent"
                          [selected]=" studentsControl.value &&
                          studentsControl.value?.indexOf(p.idParent) >= 0">
                          {{ p.name }}
                        </mat-list-option>
                      </ng-container>
                    </mat-selection-list>
                    <br> <p> nombre:
                      {{ studentsControl.value?.length }}
                    </p>
                  </mat-form-field>
                  <mat-form-field appearance="outline"
                    *ngIf="!user && scholar_level === 'CF'"
                    class="example-full-width mb-3">
                    <mat-label> {{"app.students-u" | translate }}s </mat-label>
                    <input #multiUserSearch type="text" matInput
                      placeholder="Recherche etudiant"
                      (input)="onInputChangeStudents($event)" />
                    <mat-selection-list formControlName="users"
                      (selectionChange)="
                        selectionChangeStudents($event.options)"
                      class="custom-scroll-bar">
                      <ng-container *ngFor="let p of filteredStudents">
                        <mat-list-option [value]="p.id"
                          [selected]=" studentsControl.value &&
                          studentsControl.value?.indexOf(p.id) >= 0">
                          {{ p.name }}
                        </mat-list-option>
                      </ng-container>
                    </mat-selection-list>
                    <br> <p> nombre:
                      {{ studentsControl.value?.length }}
                    </p>
                  </mat-form-field>
                </div>
              </div>

              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <button class="btn-space"
                    [disabled]="!smsForm.valid || loading"
                    [class.auth-spinner]="loading"
                    (click)="addSms()" mat-raised-button
                    color="primary">{{"app.save" | translate }}</button>
                  <button type="button" mat-raised-button
                    color="warn" (click)="cancel()">
                    {{"app.cancel" | translate }}
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
