<div class="container">
  <h3 mat-dialog-title>{{"app.are_you_sure" | translate }}</h3>
  <div mat-dialog-content>
    <ul class="clearfix">
      <li>
        <p>
          <span class="font-weight-bold">
            {{"app.name" | translate }}:
          </span>
          {{data.name}}
        </p>
      </li>
      <li>
        <p>
          <span class="font-weight-bold">
            {{"app.gender" | translate }}:
          </span>
          <span *ngIf="data.gender==='male'">
            <span class="badge badge-solid-green">
              {{'app.male' | translate}}</span>
            </span>
          <span *ngIf="data.gender==='female'">
            <span class="badge badge-solid-purple">
              {{'app.female' | translate}}</span>
          </span> 
      </li>
      <li>
        <p>
          <span class="font-weight-bold">
            {{"app.phone" | translate }}:
          </span>
          {{data.phone}}
        </p>
      </li> 
    </ul>
  </div>
  <div mat-dialog-actions class="mb-1">
    <button class="btn-space"
      [class.auth-spinner]="loading"
      [disabled]="loading"
      (click)="confirmDelete()"
      mat-flat-button color="warn">
      {{"app.delete" | translate }}
    </button>
    <button mat-flat-button
      (click)="onNoClick()" tabindex="-1">
      {{"app.cancel" | translate }}
    </button>
  </div>
</div>
