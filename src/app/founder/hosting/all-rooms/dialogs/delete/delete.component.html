<div class="container">
  <h3 mat-dialog-title>
    {{"app.are_you_sure" | translate }}
  </h3>
  <div mat-dialog-content>
    <ul class="clearfix">
      <li>
        <p>
          <span class="font-weight-bold">
            {{"app.name" | translate }}:
          </span>
          {{data.name}}
        </p>
      </li>
      <li>
        <p>
          <span class="font-weight-bold">
            {{"app.price" | translate }}:
          </span>
          {{ data.price }}
        </p>
      </li>
      <li>
        <p>
          <span class="font-weight-bold">
            {{"app.categorie" | translate }}:
          </span>
          {{data.room_category.name}}
        </p>
      </li>
      <!-- <li>
        <p>
          <span class="font-weight-bold">
            {{"app.country" | translate }}:
          </span>
          {{data.country}}
        </p>
      </li>
      <li>
        <p>
          <span class="font-weight-bold">
            {{"app.city" | translate }}:
          </span>
          {{data.city}}
        </p>
      </li> -->
    </ul>
  </div>
  <div mat-dialog-actions class="mb-1">
    <button class="btn-space"
      [class.auth-spinner]="loading"
      [disabled]="loading"
      (click)="confirmDelete()"
      mat-flat-button color="warn">
      {{"app.delete" | translate }}
    </button>
    <button mat-flat-button
      (click)="onNoClick()"
      tabindex="-1">
      {{"app.cancel" | translate }}
    </button>
  </div>
</div>
