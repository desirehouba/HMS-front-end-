<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          {{valider | translate}}
        </div>
      </div>
    </div>
    <button mat-icon-button
      (click)="dialogRef.close()"
      class="modal-close-button"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="validForm">
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field appearance="outline"
            class="example-full-width mb-3">
            <mat-label> Code </mat-label>
            <input matInput type="number"
              formControlName="code">
            <mat-error *ngIf="validForm.get('code')?.hasError('required')">
              code is required
            </mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button class="btn-space"
              [disabled]="!validForm.valid || loading"
              [class.auth-spinner]="loading"
              [disabled]="loading" color="primary"
              (click)="getStatusMobile()"
              mat-raised-button>
              {{"app.save" | translate }}
            </button><!-- 
            <button mat-raised-button color="warn"
              (click)="getStatusMobile()" tabindex="-1">
              {{"app.cancel" | translate }}
            </button> -->
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
