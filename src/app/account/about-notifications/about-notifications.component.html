<section class="content">
  <div class="content-block">
    <div class="row clearfix">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="body">
            <mat-vertical-stepper [linear]="isLinear" #stepper>
              <mat-step [stepControl]="VFormGroup1!">
                <div class="row">
                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <div>
                      <div class="body">
                        <ng-template matStepLabel
                          class="text-muted">
                          {{ "app.read_all_notifications" | translate }}
                        </ng-template>
                        <mat-accordion class="example-headers-align">
                          <mat-expansion-panel
                            *ngFor="let parts of notifications"
                            hideToggle>
                            <mat-expansion-panel-header>
                              <mat-panel-title class="text-muted">
                                {{ parts.title }}
                              </mat-panel-title>
                              <mat-panel-title class="text-muted">
                                {{ "app.date" | translate }} :
                                {{ parts.created_at | date:'dd/MM/yyyy'}}
                              </mat-panel-title>
                              <mat-panel-title class="text-muted">
                                {{ "app.hour" | translate }} :
                                {{ parts.created_at | slice:11:16 }}
                              </mat-panel-title>
                            </mat-expansion-panel-header>
                            <div class="row">
                              <div
                                class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                                <p class="text-muted">
                                  {{"app.description" | translate }}
                                </p>
                                {{ parts.description }}
                              </div>
                            </div>
                          </mat-expansion-panel>
                        </mat-accordion>
                      </div>
                    </div>
                  </div>
                </div>
              </mat-step>
            </mat-vertical-stepper>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
