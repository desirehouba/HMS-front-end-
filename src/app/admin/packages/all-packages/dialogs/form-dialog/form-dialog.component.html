<div class="addContainer">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <!--  <img [src]='packages.image' alt="avatar"> -->
        <div class="modal-about">
          <!-- {{"app.modi" | translate}} -->
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()"
      class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="packageForm" >
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>Wording </mat-label>
            <input matInput formControlName="name" required>
            <mat-error *ngIf="packageForm.get('name')?.hasError('required')">
              Name of forfait is required
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>Level</mat-label>
            <mat-select formControlName="level">
              <mat-option
                *ngFor="let level of levels"
                [value]="level">
                {{ level }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="packageForm.get('level')?.hasError('required')">
              housing Categorie is required
            </mat-error>
          </mat-form-field>
        </div>

      </div>
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>Duration</mat-label>
            <input matInput formControlName="duration" required>
            <mat-error
              *ngIf="packageForm.get('duration')?.hasError('required')">
              duration of forfait is required
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>Price </mat-label>
            <input matInput formControlName="price" type="number" min=0
              required>
            <mat-error *ngIf="packageForm.get('price')?.hasError('required')">
              number of cities of forfait is required
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>website</mat-label>
            <mat-select formControlName="website">
              <mat-option
                *ngFor="let website of choices"
                [value]="website">
                {{ website }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>mail_pro</mat-label>
            <mat-select formControlName="mail_pro">
              <mat-option
                *ngFor="let mail_pro of choices"
                [value]="mail_pro">
                {{ mail_pro }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description"></textarea>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button mat-raised-button color="primary"
              [disabled]="!packageForm.valid" [mat-dialog-close]="1"
              (click)="updatePackages()">Save</button>
            <button mat-raised-button color="warn"
              (click)="onNoClick()" tabindex="-1">Cancel</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
