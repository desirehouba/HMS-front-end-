<section class="content">
  <div class="content-block">

    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="header">
            <h2>Add Package</h2>

          </div>
          <div class="body">
            <form class="m-4" [formGroup]="packageForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>Wording </mat-label>
                    <input matInput formControlName="name" required>
                    <mat-error
                      *ngIf="packageForm.get('name')?.hasError('required')">
                      Name of forfait is required
                    </mat-error>
                  </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>Level</mat-label>
                    <mat-select formControlName="level">
                      <mat-option
                        *ngFor="let level of levels"
                        [value]="level">
                        {{ level }}
                      </mat-option>
                    </mat-select>
                    <mat-error
                      *ngIf="packageForm.get('level')?.hasError('required')">
                      housing Categorie is required
                    </mat-error>
                  </mat-form-field>
                </div>

              </div>
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>Duration</mat-label>
                    <input matInput formControlName="duration" required>
                    <mat-error
                      *ngIf="packageForm.get('duration')?.hasError('required')">
                      duration of forfait is required
                    </mat-error>
                  </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>Price </mat-label>
                    <input matInput formControlName="price" type="number" min=0
                      required>
                    <mat-error
                      *ngIf="packageForm.get('price')?.hasError('required')">
                      number of cities of forfait is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>website</mat-label>
                    <mat-select formControlName="website">
                      <mat-option
                        *ngFor="let website of choices"
                        [value]="website">
                        {{ website }}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>mail_pro</mat-label>
                    <mat-select formControlName="mail_pro">
                      <mat-option
                        *ngFor="let mail_pro of choices"
                        [value]="mail_pro">
                        {{ mail_pro }}
                      </mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>Description</mat-label>
                    <textarea matInput formControlName="description"></textarea>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <button class="btn-space" [disabled]="!packageForm.valid"
                    (click)="addPackage()" mat-raised-button
                    color="primary">Submit</button>
                  <!-- <button type="button" mat-raised-button color="warn">Cancel</button> -->
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
