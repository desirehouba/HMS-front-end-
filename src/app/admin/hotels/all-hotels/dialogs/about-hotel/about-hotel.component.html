<div class="addContainer with">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <!-- <img [src]='hotels.photo' alt="avatar"> -->
        <div class="modal-about">
          {{"app.more_informations" | translate }}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()" class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content class="card">
    <form [formGroup]="hotelForm">
      <div class="row clearfix mag-5">
        <div class="col-lg-4 col-md-12">
          <div class="card">
            <div class="m-b-20">
              <div class="contact-grid">
                <div class="profile-header bg-dark">
                  <br />
                  <div class="user-name">{{ hotels.name }}</div>
                  <br />
                </div>
                <img
                  [src]="image" 
                  class="user-img"
                  alt=""
                />
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-8 col-md-12">
          <div class="card">
            <mat-tab-group>
              <mat-tab>
                <ng-template mat-tab-label class="mag3">
                  <mat-icon class="example-tab-icon msr-2">face</mat-icon>
                  Informations
                </ng-template>
                <div class="col-lg-12 col-md-12 col-sm-12 mag2">
                  <div class="project_widget mag2">
                    <div class="header">
                      <h2><strong class="text-muted">{{"app.see_more" | translate }}</strong></h2>
                    </div>
                    <div class="body">
                      <div class="row">
                        <div class="col-md-4 col-6 b-r">
                          <strong class="text-muted">{{"app.email" | translate }}</strong>
                          <br />
                          <p>{{ hotels.email }}</p>
                        </div>
                        <div class="col-md-4 col-6 b-r">
                          <strong class="text-muted">{{"app.website" | translate }}</strong>
                          <br />
                          <p>{{ hotels.website }}</p>
                        </div>
                        <div class="col-md-4 col-6">
                          <strong class="text-muted">{{"app.phone" | translate }}</strong>
                          <br />
                          <p>
                            {{ hotels.phone }}
                          </p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </mat-tab>
            </mat-tab-group>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
