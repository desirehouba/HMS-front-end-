<section class="content">
  <div class="content-block">

    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="header">
            <h2>{{"app.add_privielges" | translate }}</h2>

          </div>
          <div class="body">
            <form class="m-4" [formGroup]="privilegeForm"
              (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.code" | translate }} </mat-label>
                    <input matInput formControlName="name" required>
                    <mat-error
                      *ngIf="privilegeForm.get('name')?.hasError('required')">
                      Name of privilege is required
                    </mat-error>
                  </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.ressource" | translate }}</mat-label>
                    <input matInput formControlName="ressource" required>
                    <mat-error
                      *ngIf="privilegeForm.get('ressource')?.hasError('required')">
                      ressource is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.description" | translate }}</mat-label>
                    <textarea matInput formControlName="description"></textarea>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <button class="btn-space" color="primary"
                    [disabled]="!privilegeForm.valid || loading"
                    [class.auth-spinner]="loading"
                    (click)="addPrivilege()" mat-raised-button>
                    {{"app.save" | translate }}
                  </button>
                  <button type="button" mat-raised-button color="warn"
                    (click)="cancel()">{{"app.cancel" | translate }}</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
