<section class="content">
  <div class="content-block">

    <div class="row clearfix">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="card">
          <div class="header">
            <h2>{{"app.add_service" | translate }}</h2>
          </div>
          <div class="body">
            <form class="m-4" [formGroup]="departementForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-xl-9 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.name" | translate }}</mat-label>
                    <input matInput formControlName="name" required>
                  </mat-form-field>
                </div>
                <div class="col-xl-3 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.lang" | translate }}</mat-label>
                    <input matInput formControlName="lang" required>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.hotel" | translate }}</mat-label>
                    <mat-select formControlName="hotel">
                      <mat-option
                        *ngFor="let hotel of hotels"
                        [value]="hotel.id">
                        {{ hotel.name }}
                      </mat-option>
                    </mat-select>
                    <mat-error
                      *ngIf="departementForm.get('hotel')?.hasError('required')">
                      hotel is required
                    </mat-error>
                  </mat-form-field>
                </div>
                <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.responsable" | translate }}</mat-label>
                    <mat-select formControlName="responsible">
                      <mat-option
                        *ngFor="let responsible of responsibles"
                        [value]="responsible.id">
                        {{ responsible.name }}
                      </mat-option>
                    </mat-select>
                    <mat-error
                      *ngIf="departementForm.get('responsible')?.hasError('required')">
                      responsible is required
                    </mat-error>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <mat-form-field class="example-full-width mb-3"
                    appearance="outline">
                    <mat-label>{{"app.description" | translate }}</mat-label>
                    <textarea matInput formControlName="description"></textarea>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                  <button class="btn-space"
                    [disabled]="!departementForm.valid || loading"
                    [class.auth-spinner]="loading"
                    (click)="addDepartements()" mat-raised-button
                    color="primary">{{"app.save" | translate }}</button>
                  <button type="button" mat-raised-button color="warn"
                    (click)="cancel()">{{"app.cancel" | translate }}</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
