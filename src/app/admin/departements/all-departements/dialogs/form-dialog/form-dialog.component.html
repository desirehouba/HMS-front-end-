<div class="addContainer with">
  <div class="modalHeader">
    <div class="editRowModal">
      <div class="modalHeader clearfix">
        <div class="modal-about">
          {{"app.modi" | translate}}
        </div>
      </div>
    </div>
    <button mat-icon-button (click)="dialogRef.close()"
      class="modal-close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form class="register-form m-4" [formGroup]="departementForm">
      <div class="row">
        <div class="col-xl-9 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3"
            appearance="outline">
            <mat-label>{{"app.name" | translate }}</mat-label>
            <input matInput formControlName="name" required>
          </mat-form-field>
        </div>
        <div class="col-xl-3 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3"
            appearance="outline">
            <mat-label>{{"app.lang" | translate }}</mat-label>
            <input matInput formControlName="lang" required>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>{{"app.hotel" | translate }}</mat-label>
            <mat-select formControlName="hotel">
              <mat-option [value]="hotel.id"
                *ngFor="let hotel of hotels">
                {{ hotel.name }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="departementForm.get('hotel')?.hasError('required')">
              hotel is required
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>{{"app.principal" | translate }}</mat-label>
            <mat-select formControlName="principal">
              <mat-option [value]="principal.id"
                *ngFor="let principal of principals">
                {{ principal.name }}
              </mat-option>
            </mat-select>
            <mat-error
              *ngIf="departementForm.get('principal')?.hasError('required')">
              principal is required
            </mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <mat-form-field class="example-full-width mb-3" appearance="outline">
            <mat-label>{{"app.description" | translate }}</mat-label>
            <textarea matInput formControlName="description"></textarea>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
          <div class="example-button-row">
            <button mat-raised-button color="primary"
              [disabled]="!departementForm.valid" [mat-dialog-close]="1"
              (click)="updateDepartements()">
              {{"app.save" | translate }}</button>
            <button mat-raised-button color="warn"
              (click)="onNoClick()" tabindex="-1">
              {{"app.cancel" | translate }}</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
